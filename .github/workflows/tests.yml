name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    # Default matrix runs against the dev-pinned laravel/ai (^0.7) — the
    # recommended target for v0.5.0 of this package. Older lines are covered
    # by the compat jobs below.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }} · laravel/ai ^0.7

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  prism-only:
    # Validates the Prism-side integration with no laravel/ai installed at
    # all — protects users who use `Prism::text()->using('workers-ai', ...)`
    # without ever touching the agent() bridge.
    runs-on: ubuntu-latest
    name: Prism-only (no laravel/ai)

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Remove laravel/ai dev dep
        run: composer remove --dev --no-interaction --no-update laravel/ai

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Run Prism-side tests only
        # tests/LaravelAi/ fixtures use traits from laravel/ai; autoloading
        # them when laravel/ai is absent fatals. Use the dedicated Prism
        # testsuite which excludes that directory.
        run: vendor/bin/pest --testsuite=Prism

  no-prism:
    # Validates the Laravel AI native gateway works with prism-php/prism
    # genuinely absent from vendor/. As of v0.5.0, prism-php/prism is a
    # `suggest` (not `require`) — Laravel-AI-only users should not pay for
    # Prism's transitive footprint. This job locks that promise in.
    runs-on: ubuntu-latest
    name: No-Prism (laravel/ai only)

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Remove prism-php/prism dev dep
        run: composer remove --dev --no-interaction --no-update prism-php/prism

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Verify Prism is genuinely absent
        run: |
          test ! -d vendor/prism-php/prism || (echo "Prism still in vendor — failing"; exit 1)

      - name: Run Laravel AI tests only
        # Use the dedicated testsuite which excludes Prism-side test files.
        # tests/LaravelAiBridgeTest.php has self-skip guards for individual
        # Prism-only cases.
        run: vendor/bin/pest --testsuite=LaravelAi

  laravel-ai-v06-compat:
    # Backward-compat against laravel/ai ^0.6.x — the line we originally
    # built against. The native gateway uses only stable contracts
    # (TextGateway, EmbeddingGateway) so v0.6.x stays working.
    runs-on: ubuntu-latest
    name: laravel/ai ^0.6 compat

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Pin laravel/ai to ^0.6
        run: composer require --dev --no-interaction --no-update 'laravel/ai:^0.6.3' 'orchestra/testbench:^10.0'

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Run tests
        run: vendor/bin/pest

  laravel-ai-v05-compat:
    # Backward-compat against laravel/ai ^0.5.x — the last line that still
    # ships PrismGateway. The native gateway uses only stable contracts so
    # v0.5.x should still work, modulo a few v0.7-only primitives (TopP
    # attribute, providerOptions on embeddings, Strict attribute) that
    # silently no-op on older laravel/ai versions.
    runs-on: ubuntu-latest
    name: laravel/ai ^0.5 compat

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Pin laravel/ai to ^0.5 + matching testbench
        run: composer require --dev --no-interaction --no-update 'laravel/ai:^0.5.1' 'orchestra/testbench:^9.0'

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Run tests
        run: vendor/bin/pest
